<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-PORTFOLIO GENERATOR</title>
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030712;
            --card-bg: rgba(17, 24, 39, 0.45);
            --border-color: rgba(255, 255, 255, 0.06);
            --accent-cyan: #06b6d4;
            --accent-cyan-glow: rgba(6, 182, 212, 0.15);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Mouse Glow Ambient Ring Effect */
        #mouse-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.04) 0%, rgba(0,0,0,0) 70%);
            top: 0;
            left: 0;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Navbar Layout */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(3, 7, 18, 0.75);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .logo span { color: var(--accent-cyan); }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.08);
            border: 1px solid rgba(6, 182, 212, 0.15);
            padding: 6px 14px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        /* App Container Grid Layout */
        .app-container {
            max-width: 1140px;
            margin: 80px auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        /* Form Controls & Glass Panels */
        .config-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 48px;
            backdrop-filter: blur(20px);
            max-width: 640px;
            margin: 0 auto;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }

        .config-panel h2 {
            font-size: 1.85rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.8px;
        }

        .config-panel h2 span { color: var(--accent-cyan); }

        .section-desc {
            color: var(--text-muted);
            font-size: 0.92rem;
            margin-bottom: 36px;
            line-height: 1.5;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
        }

        .form-group input {
            background: rgba(3, 7, 18, 0.5);
            border: 1px solid var(--border-color);
            padding: 14px 16px;
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.92rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            background: rgba(3, 7, 18, 0.8);
            box-shadow: 0 0 12px var(--accent-cyan-glow);
        }

        /* Buttons */
        .btn-primary {
            background: var(--text-main);
            color: var(--bg-dark);
            border: none;
            padding: 16px 28px;
            font-size: 0.92rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(255,255,255,0.15);
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Loader System */
        .loader-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 28px;
            padding: 14px;
            background: rgba(6, 182, 212, 0.03);
            border: 1px dashed rgba(6, 182, 212, 0.2);
            border-radius: 6px;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(6, 182, 212, 0.1);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loader-wrapper p {
            font-size: 0.8rem;
            color: var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.5px;
        }

        /* Outputs Framework & Columns styling */
        .portfolio-canvas {
            display: flex;
            flex-direction: column;
            gap: 48px;
        }

        .profile-masthead {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 36px;
        }

        .profile-masthead h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 8px;
        }

        .profile-masthead h3 {
            font-size: 1.05rem;
            color: var(--accent-cyan);
            font-weight: 600;
            margin-bottom: 20px;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -0.2px;
        }

        .profile-masthead p {
            color: var(--text-muted);
            font-size: 1.02rem;
            line-height: 1.65;
            max-width: 760px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
        }

        .canvas-col {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .column-header {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Cards and Elements Framework */
        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            transition: all 0.2s ease;
        }

        .project-card:hover {
            border-color: rgba(6, 182, 212, 0.3);
            background: rgba(17, 24, 39, 0.6);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .skills-grid-box {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-chip {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            background: rgba(3, 7, 18, 0.4);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            color: var(--text-main);
            transition: all 0.2s ease;
        }
        
        .skill-chip:hover {
            border-color: var(--accent-cyan);
            color: #fff;
        }

        /* Media Simulator Sandbox Box styling */
        .app-preview-container {
            margin-top: 18px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            background: #020617;
        }

        .simulator-header {
            background: rgba(3, 7, 18, 0.6);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .simulator-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
        }

        .simulator-path {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--text-muted);
            margin-left: 10px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="mouse-glow"></div>

    <header class="navbar">
        <div class="logo">Folio<span>.</span></div>
        <div class="status-badge">
            <div class="status-dot"></div>
        </div>
    </header>

    <main class="app-container">
        <!-- Configuration Form Input Panel -->
        <section id="generator-dock" class="config-panel">
            <h2>Generate your <span>live portfolio.</span></h2>
            <p class="section-desc">Drop your coordinates parameters below. The AI pipeline analyzes your real GitHub footprint instantly.</p>
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="fullname_input">Full Name</label>
                    <input type="text" id="fullname_input" placeholder="e.g. ABDYEIOHJ">
                </div>
                <div class="form-group">
                    <label for="title_input">Title Target</label>
                    <input type="text" id="title_input" placeholder="e.g. Frontend Architect">
                </div>
            </div>

            <div class="form-group">
                <label for="github_user_input">GitHub Username</label>
                <input type="text" id="github_user_input" placeholder="e.g. ABSEREIIJ">
            </div>

            <div class="form-group">
                <label for="linkedin_url_input">LinkedIn URL</label>
                <input type="text" id="linkedin_url_input" placeholder="https://linkedin.com/in/username">
            </div>

            <button id="sync-action-btn" class="btn-primary" style="width: 100%; margin-top: 10px;" onclick="executeFolioSync()">
                Assemble Technical Portfolio &rarr;
            </button>
            
            <div id="loader" class="loader-wrapper hidden">
                <div class="spinner"></div>
                <p>RUNNING ARCHITECTURAL SYNCHRONIZATION MATRIX...</p>
            </div>
        </section>

        <!-- Dynamic Layout Canvas Output View Window -->
        <section id="portfolio-output-view" class="portfolio-canvas hidden">
            <div class="profile-masthead">
                <h1 id="out-name">---</h1>
                <h3 id="out-title">---</h3>
                <p id="out-bio">---</p>
            </div>

            <div class="dashboard-grid">
                <div class="canvas-col">
                    <h3 class="column-header">// Production Chronology</h3>
                    <div id="out-history" style="display: flex; flex-direction: column; gap: 20px;"></div>
                </div>

                <div class="canvas-col">
                    <h3 class="column-header">// Core Ecosystem</h3>
                    <div id="out-skills" class="skills-grid-box"></div>

                    <h3 class="column-header">// Verified Repository Builds</h3>
                    <div id="out-repos" style="display: flex; flex-direction: column; gap: 20px;"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
